apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: todoapp-checker
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: todoapp-checker
  template:
    metadata:
      labels:
        app: todoapp-checker
    spec:
      containers:
        - name: curl-checker
          image: ikulyk404/busyboxplus:curl
          command:
            - sh
            - -c
            - while true; do curl -s http://todoapp-service.todoapp.svc.cluster.local/api/health; sleep 5; done
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"